name: Build IPA

# 触发方式：
#   1) push 到 main 分支
#   2) 或手动：GitHub 仓库页 → Actions → Build IPA → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project PocketCam.xcodeproj \
            -scheme PocketCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PocketCam.app Payload/
          zip -r PocketCam.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketCam-ipa
          path: PocketCam.ipa
          retention-days: 14
